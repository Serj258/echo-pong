# TEMPLATE ONLY - do not apply as-is, do not commit a real secret.
#
# App reads the token from a file (SECRET_FILE_PATH), so it's mounted as a
# volume rather than an env var - never shows up in `kubectl describe` or
# a Pod spec dump.
#
# Create the real one imperatively (never touches git):
#   kubectl create secret generic echo-pong-token \
#     --namespace echo-pong \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# Real cluster: use External Secrets Operator + AWS Secrets Manager
# instead - see docs/ARCHITECTURE.md.
apiVersion: v1
kind: Secret
metadata:
  name: echo-pong-token
  namespace: echo-pong
type: Opaque
stringData:
  token: "CHANGE_ME"
